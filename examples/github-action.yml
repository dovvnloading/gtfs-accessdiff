# Example for an adopting agency, with two reviewed GTFS snapshots committed
# to its repository (or downloaded by a separate, controlled step).
# Do not enable gating until you've checked ID stability and trial reports.
name: Accessibility metadata regression check
on:
  pull_request:
    paths:
      - 'feeds/**'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # After publishing the project on GitHub, pin the installation to a commit SHA.
      - name: Install
        run: python -m pip install .
      - name: Compare reviewed baseline with candidate feed
        run: |
          gtfs-accessdiff feeds/approved.zip feeds/candidate.zip \
            --format markdown --output accessdiff-report.md --fail-on-loss
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-regression-report
          path: accessdiff-report.md
