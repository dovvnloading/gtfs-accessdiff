# Copy this to .github/workflows/accessibility-review.yml in a feed publisher's repo.
# Only compares two explicitly provided files checked out locally in this job.
# Pin the reusable action to a reviewed full commit SHA before production use.
name: Accessibility data review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare two checked-in or independently provisioned GTFS archives
        id: accessdiff
        uses: dovvnloading/gtfs-accessdiff@main # Replace with a reviewed commit SHA
        with:
          baseline: feeds/approved.zip
          candidate: feeds/proposed.zip
          # Leave false while reviewing your feed's stop-ID stability.
          fail-on-loss: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-review
          path: gtfs-accessdiff-reports/
          if-no-files-found: warn
