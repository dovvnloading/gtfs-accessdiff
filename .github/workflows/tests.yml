name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests (no network required)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run sample comparison
        run: PYTHONPATH=src python -m gtfs_accessdiff samples/baseline.zip samples/candidate.zip --format json --output /tmp/audit.json
      - name: Smoke-test published composite action on synthetic GTFS
        id: action_smoke
        uses: ./
        with:
          baseline: samples/baseline.zip
          candidate: samples/candidate.zip
          report-directory: ${{ runner.temp }}/gtfs-accessdiff-action
          fail-on-loss: 'false'
      - name: Check composite action JSON and Markdown
        env:
          JSON_REPORT: ${{ steps.action_smoke.outputs.json-report }}
          MARKDOWN_REPORT: ${{ steps.action_smoke.outputs.markdown-report }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["JSON_REPORT"]).read_text(encoding="utf-8"))
          assert report["schema_version"] == "0.5.0"
          assert report["status_transition_total"] == report["comparable_records"]
          assert sum(row["records"] for row in report["status_transitions"]) == report["comparable_records"]
          assert any(row["baseline_value"] == "1" and row["candidate_value"] == "unknown" for row in report["status_transitions"])
          assert report["information_losses"] == 2
          assert "# GTFS AccessDiff report" in Path(os.environ["MARKDOWN_REPORT"]).read_text(encoding="utf-8")
          PYTHON
      - name: Exercise opt-in CI failure on synthetic loss
        id: action_gate
        uses: ./
        continue-on-error: true
        with:
          baseline: samples/baseline.zip
          candidate: samples/candidate.zip
          report-directory: ${{ runner.temp }}/gtfs-accessdiff-gate
          fail-on-loss: 'true'
      - name: Confirm the optional gate did fail
        env:
          GATE_OUTCOME: ${{ steps.action_gate.outcome }}
        run: test "$GATE_OUTCOME" = "failure"

      - name: Generate a synthetic published known-status change (not information loss)
        env:
          FIXTURE_DIR: ${{ runner.temp }}/gtfs-status-test
        run: |
          python - <<'PYTHON'
          import io, os, csv, zipfile
          from pathlib import Path
          root = Path(os.environ['FIXTURE_DIR'])
          root.mkdir(parents=True, exist_ok=True)
          for name, status in [('baseline', '1'), ('candidate', '2')]:
              buffer = io.StringIO(newline='')
              writer = csv.writer(buffer)
              writer.writerow(['stop_id', 'stop_name', 'wheelchair_boarding'])
              writer.writerow(['KNOWN_STATUS', 'Sample stop', status])
              with zipfile.ZipFile(root / (name + '.zip'), 'w', compression=zipfile.ZIP_DEFLATED) as archive:
                  archive.writestr('stops.txt', buffer.getvalue())
          PYTHON
      - name: Exercise optional status-change CI failure
        id: action_status_gate
        continue-on-error: true
        uses: ./
        with:
          baseline: ${{ runner.temp }}/gtfs-status-test/baseline.zip
          candidate: ${{ runner.temp }}/gtfs-status-test/candidate.zip
          report-directory: ${{ runner.temp }}/gtfs-status-test/reports-gated
          fail-on-loss: 'false'
          fail-on-status-change: 'true'
      - name: Confirm status-change gate fails without counting information losses
        env:
          STATUS_GATE_OUTCOME: ${{ steps.action_status_gate.outcome }}
        run: |
          test "$STATUS_GATE_OUTCOME" = failure
          python - <<'PYTHON'
          import json
          from pathlib import Path
          import os
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gtfs-status-test' / 'reports-gated' / 'audit.json').read_text())
          assert report['status_changes'] == 1
          assert report['information_losses'] == 0
          assert report['status_transitions'] == [{'baseline_value':'1', 'candidate_value':'2', 'records':1}]
          PYTHON
      - name: Confirm report-only still works with known-status change
        uses: ./
        with:
          baseline: ${{ runner.temp }}/gtfs-status-test/baseline.zip
          candidate: ${{ runner.temp }}/gtfs-status-test/candidate.zip
          report-directory: ${{ runner.temp }}/gtfs-status-test/reports-nonblocking
          fail-on-loss: 'false'
          fail-on-status-change: 'false'

      - name: Create disjoint GTFS stop IDs for zero-coverage safety check
        env:
          FIXTURE_DIR: ${{ runner.temp }}/gtfs-disjoint-test
        run: |
          python - <<'PYTHON'
          import csv, io, os, zipfile
          from pathlib import Path
          root = Path(os.environ['FIXTURE_DIR'])
          root.mkdir(parents=True, exist_ok=True)
          for filename, stop_id in [('baseline', 'A'), ('candidate', 'B')]:
              buffer = io.StringIO(newline='')
              writer = csv.writer(buffer)
              writer.writerow(['stop_id', 'stop_name', 'wheelchair_boarding'])
              writer.writerow([stop_id, 'Unrelated stop', '1'])
              with zipfile.ZipFile(root / (filename + '.zip'), 'w') as archive:
                  archive.writestr('stops.txt', buffer.getvalue())
          PYTHON
      - name: Exercise zero-overlap fail-closed CI gate despite minimum zero
        id: action_zero_coverage
        continue-on-error: true
        uses: ./
        with:
          baseline: ${{ runner.temp }}/gtfs-disjoint-test/baseline.zip
          candidate: ${{ runner.temp }}/gtfs-disjoint-test/candidate.zip
          report-directory: ${{ runner.temp }}/gtfs-disjoint-test/reports
          min-overlap: '0'
          fail-on-loss: 'true'
      - name: Confirm zero-coverage gate fails and does not say clean
        env:
          ZERO_GATE_OUTCOME: ${{ steps.action_zero_coverage.outcome }}
        run: |
          test "$ZERO_GATE_OUTCOME" = failure
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          report_path = Path(os.environ['RUNNER_TEMP']) / 'gtfs-disjoint-test' / 'reports' / 'audit.json'
          data = json.loads(report_path.read_text(encoding='utf-8'))
          assert data['comparable_records'] == 0
          assert data['status'] == 'inconclusive_low_id_overlap'
          assert data['status_transition_total'] == 0
          PYTHON

      - name: Generate unknown-only baseline/candidate fixtures
        run: |
          python - <<'PYTHON'
          import csv, io, os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'gtfs-unknown-only'
          root.mkdir(parents=True, exist_ok=True)
          for name in ('baseline', 'candidate'):
              buffer = io.StringIO(newline='')
              writer = csv.writer(buffer)
              writer.writerow(['stop_id', 'stop_name', 'wheelchair_boarding'])
              writer.writerow(['UNKNOWN', 'Synthetic unknown stop', '0'])
              with zipfile.ZipFile(root / (name + '.zip'), 'w') as archive:
                  archive.writestr('stops.txt', buffer.getvalue())
          PYTHON
      - name: Confirm zero-known baseline is inconclusive with opt-in gate
        id: action_unknown_baseline
        continue-on-error: true
        uses: ./
        with:
          baseline: ${{ runner.temp }}/gtfs-unknown-only/baseline.zip
          candidate: ${{ runner.temp }}/gtfs-unknown-only/candidate.zip
          report-directory: ${{ runner.temp }}/gtfs-unknown-only/reports
          fail-on-loss: 'true'
      - name: Verify unknown baseline report and gate outcome
        env:
          UNKNOWN_GATE_OUTCOME: ${{ steps.action_unknown_baseline.outcome }}
        run: |
          test "$UNKNOWN_GATE_OUTCOME" = failure
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          file = Path(os.environ['RUNNER_TEMP']) / 'gtfs-unknown-only' / 'reports' / 'audit.json'
          report = json.loads(file.read_text(encoding='utf-8'))
          assert report['status'] == 'inconclusive_no_known_baseline'
          assert report['baseline_comparable_known_records'] == 0
          assert report['comparable_records'] == 1
          PYTHON
