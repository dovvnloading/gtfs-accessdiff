[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs-accessdiff"
version = "0.2.0"
description = "Compare wheelchair accessibility metadata across GTFS feed releases"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["GTFS", "accessibility", "open-data", "regression", "transit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
gtfs-accessdiff = "gtfs_accessdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
